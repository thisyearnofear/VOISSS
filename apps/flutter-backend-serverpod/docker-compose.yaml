services:
  voisss_butler_server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voisss_butler_server
    ports:
      # Localhost-only: nginx is the only public path to the API.
      - 127.0.0.1:8090:8080
    environment:
      - RUNMODE=production
      - VENICE_API_KEY=${VENICE_API_KEY:-}
      - FEATHERLESS_API_KEY=${FEATHERLESS_API_KEY:-}
      - BUTLER_LLM_KEY=${BUTLER_LLM_KEY:-}
      - BUTLER_LLM_URL=${BUTLER_LLM_URL:-}
      - BUTLER_LLM_MODEL=${BUTLER_LLM_MODEL:-}
    volumes:
      # Server runs from / — it reads /config, not /app/config.
      - ./config:/config:ro
    depends_on:
      - voisss_butler_postgres
    networks:
      - voisss_butler_network
    command: [dart, bin/main.dart, --apply-migrations]

  voisss_butler_postgres:
    image: postgres:16-alpine
    container_name: voisss_butler_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: voisss_butler
    ports:
      # Localhost-only: Postgres is not a public service (docker-published
      # ports bypass ufw entirely).
      - 127.0.0.1:8093:5432
    volumes:
      - voisss_butler_postgres_data:/var/lib/postgresql/data
    networks:
      - voisss_butler_network

volumes:
  voisss_butler_postgres_data:

networks:
  voisss_butler_network:
    driver: bridge

name: Deploy VOISSS Backend

on:
  push:
    branches:
      - main
    paths:
      - 'services/voisss-backend/**'
      - 'packages/shared/**'
      - '.github/workflows/deploy-voisss-backend.yml'
  workflow_dispatch:

env:
  DEPLOY_PATH: /opt/voisss-processing
  SSH_PORT: ${{ secrets.HETZNER_SSH_PORT || '22' }}
  KEEP_RELEASES: 3
  HEALTH_RETRIES: 15
  HEALTH_INTERVAL: 3

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # version comes from package.json "packageManager" (pnpm@8.15.4)

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VOISSS_DEPLOY_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ env.SSH_PORT }} -H ${{ secrets.HETZNER_HOST }} >> ~/.ssh/known_hosts

      # The backend depends on @voisss/shared via workspace:* — npm cannot resolve
      # that protocol, so we install with pnpm and build the shared package here.
      - name: Build shared package
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm --filter @voisss/shared build
          tar czf /tmp/shared-build.tgz -C packages/shared dist src package.json
          echo "shared build staged: $(du -h /tmp/shared-build.tgz | cut -f1)"

      - name: Deploy via rsync + server-side assembly
        env:
          SERVER: deploy@${{ secrets.HETZNER_HOST }}
        run: |
          set -euo pipefail
          RELEASE_NAME="release-$(date +%Y%m%d-%H%M%S)-${GITHUB_SHA:0:7}"
          echo "Deploying: ${RELEASE_NAME}"

          # Fresh source + config into the new release dir
          ssh -p ${{ env.SSH_PORT }} $SERVER "mkdir -p ${{ env.DEPLOY_PATH }}/releases/${RELEASE_NAME}/src ${{ env.DEPLOY_PATH }}/logs"
          rsync -az -e "ssh -p ${{ env.SSH_PORT }}" \
            services/voisss-backend/src/ \
            $SERVER:${{ env.DEPLOY_PATH }}/releases/${RELEASE_NAME}/src/

          rsync -az -e "ssh -p ${{ env.SSH_PORT }}" \
            services/voisss-backend/package.json \
            services/voisss-backend/ecosystem.config.js \
            $SERVER:${{ env.DEPLOY_PATH }}/releases/${RELEASE_NAME}/

          # Assemble server-side: clone the proven node_modules from the running
          # release (workspace deps + nested layout), then overlay the freshly
          # built @voisss/shared. Avoids transferring ~1GB of node_modules.
          scp -P ${{ env.SSH_PORT }} /tmp/shared-build.tgz $SERVER:/tmp/shared-build.tgz
          ssh -p ${{ env.SSH_PORT }} $SERVER << ENDSSH
            set -e
            DEPLOY=${{ env.DEPLOY_PATH }}
            REL=${RELEASE_NAME}
            cd \$DEPLOY/releases/\$REL

            if [ -d \$DEPLOY/current/node_modules ]; then
              cp -a \$DEPLOY/current/node_modules ./node_modules
            else
              echo "No current node_modules to clone — bootstrap deps on the server first." >&2
              exit 1
            fi

            # Overlay the fresh shared build WITHOUT wiping nested deps:
            # @voisss/shared/node_modules (redis, pg, axios...) comes from the
            # cloned tree, externalized from the shared bundle.
            SHARED=node_modules/@voisss/shared
            rm -rf $SHARED/dist $SHARED/src
            tar xzf /tmp/shared-build.tgz -C $SHARED
            rm -f /tmp/shared-build.tgz
            test -d $SHARED/node_modules || echo "WARN: no nested shared deps (bootstrap release?)" >&2

            ln -sfn \$DEPLOY/.env .env
            ln -sfn \$DEPLOY/logs logs

            sudo ln -sfn \$DEPLOY/releases/\$REL \$DEPLOY/current

            cd \$DEPLOY/current
            pm2 delete voisss-server voisss-export-worker voisss-acp-listener 2>/dev/null || true
            pm2 start ecosystem.config.js
            pm2 save
          ENDSSH

      - name: Health check with retry
        env:
          SERVER: deploy@${{ secrets.HETZNER_HOST }}
        run: |
          ssh -p ${{ env.SSH_PORT }} $SERVER << ENDSSH
            set -e
            attempt=1
            while [ \$attempt -le ${{ env.HEALTH_RETRIES }} ]; do
              if curl -sf http://localhost:5577/health > /dev/null 2>&1; then
                echo "Health check passed (attempt \$attempt)"
                exit 0
              fi
              echo "Health check attempt \$attempt/${{ env.HEALTH_RETRIES }} failed, waiting ${{ env.HEALTH_INTERVAL }}s..."
              sleep ${{ env.HEALTH_INTERVAL }}
              attempt=\$((attempt + 1))
            done
            echo "Health check failed after ${{ env.HEALTH_RETRIES }} attempts"
            exit 1
          ENDSSH

      - name: Cleanup old releases
        env:
          SERVER: deploy@${{ secrets.HETZNER_HOST }}
        run: |
          ssh -p ${{ env.SSH_PORT }} $SERVER << 'ENDSSH'
            set -e
            cd /opt/voisss-processing/releases
            CURRENT_NAME=$(basename $(readlink /opt/voisss-processing/current))
            ls -1t | grep -v "$CURRENT_NAME" | tail -n +3 | while read old; do
              echo "Removing: $old"
              rm -rf "$old"
            done
          ENDSSH

      - name: Deploy summary
        run: |
          echo "## Deploy Complete" >> $GITHUB_STEP_SUMMARY
          echo "- **Release:** release-$(date +%Y%m%d-%H%M%S)-${GITHUB_SHA:0:7}" >> $GITHUB_STEP_SUMMARY
          echo "- **Health:** https://voisss.famile.xyz/health" >> $GITHUB_STEP_SUMMARY
